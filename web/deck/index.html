<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>MacroDeck</title>
  <link rel="manifest" href="manifest.json" />

  <!-- iOS: ana ekrana eklenince Safari cercevesi olmadan, tam ekran "app" gibi acilsin -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MacroDeck" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" content="#111111" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pin-gate">
    <div class="pin-card">
      <h1>MacroDeck</h1>
      <input id="pin-input" type="text" inputmode="numeric" placeholder="PIN" maxlength="4" autocomplete="off" />
      <button id="pin-submit">Bağlan</button>
      <p id="pin-error" class="error-text" hidden></p>
    </div>
  </div>

  <div id="deck" hidden>
    <div id="conn-banner" hidden>Bağlantı koptu, yeniden bağlanılıyor…</div>
    <nav id="page-tabs"></nav>
    <main id="button-grid"></main>
  </div>
  <button id="rotate-toggle" hidden aria-label="Ekranı döndür">⟳</button>
  <button id="clip-toggle" hidden aria-label="Pano">PANO</button>
  <div id="clip" hidden>
    <label for="clip-pc">PC panosu</label>
    <textarea id="clip-pc" placeholder="PC'de kopyaladığın metin burada görünür"></textarea>
    <button id="clip-copy">Telefona kopyala</button>
    <label for="clip-phone">Telefondan PC'ye</label>
    <textarea id="clip-phone" placeholder="Buraya yapıştır veya yaz"></textarea>
    <button id="clip-send">PC'ye gönder</button>
    <button id="clip-close">Kapat</button>
  </div>
  <button id="pad-toggle" hidden aria-label="İz pedi">İZ PEDİ</button>
  <div id="pad" hidden>
    <div id="pad-surface"><span>Tek parmak: imleç &middot; dokun: tık<br>İki parmak: kaydır &middot; iki parmakla dokun: sağ tık</span></div>
    <div id="pad-keys">
      <input id="pad-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Yaz…" />
      <button data-key="backspace">Sil</button>
      <button data-key="enter">Enter</button>
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
    </div>
    <div id="pad-clicks">
      <button data-click="left">Sol tık</button>
      <button data-click="right">Sağ tık</button>
      <button id="pad-screen">Ekran</button>
      <button id="pad-close">Kapat</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
